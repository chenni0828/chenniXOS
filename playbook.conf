<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>chenniXOS</Name>
    <Username>chenni0828</Username>
    <ShortDescription>chenniXOS Playbook for Windows 11</ShortDescription>
    <Title>chenniXOS v0.1.0</Title>
    <Description><![CDATA[╭────────────────── ⚠️ 注意 ⚠️ ───────────────────╮
│  版本号建议 25H2，其他版本可能达不到预期效果。  │
│  建议重装系统后使用。                           │
╰─────────────────────────────────────────────────╯]]></Description>
    <Details>面向国内用户的开放、轻量级 Windows 修改，旨在优化性能、隐私与使用体验。</Details>
    <Version>0.1.0</Version>
    <UniqueId>c95216bf-a331-484a-ac59-295c154652a9</UniqueId>
    <Requirements>
		<Requirement>DefenderToggled</Requirement>
		<Requirement>NoAntivirus</Requirement>
		<Requirement>NoPendingUpdates</Requirement>
		<Requirement>UCPDDisabled</Requirement>
		<Requirement>PluggedIn</Requirement>
	</Requirements>
    <Overhaul>true</Overhaul>
	<UseKernelDriver>false</UseKernelDriver>
	<ProductCode>64</ProductCode>
	<EstimatedMinutes>8</EstimatedMinutes>
    	<FeaturePages>
		<RadioPage DefaultOption="disable-defender" Description="禁用 Defender 可提升性能。">
			<Options>
                <RadioOption>
					<Text>保留 Defender（默认）</Text>
					<Name>enable-defender</Name>
				</RadioOption>
				<RadioOption>
					<Text>禁用 Defender</Text>
					<Name>disable-defender</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage DefaultOption="mitigations-default" Description="禁用缓解措施会降低安全性，但可能在老旧 CPU 上提升性能。">
			<Options>
				<RadioOption>
					<Text>默认 Windows 缓解措施</Text>
					<Name>mitigations-default</Name>
				</RadioOption>
				<RadioOption>
					<Text>禁用所有缓解措施</Text>
					<Name>mitigations-disable</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<CheckboxPage Description="选择需要移除的内置应用，可稍后在 chenniXOS Toolkit 中调整。">
			<Options>
				<CheckboxOption>
					<Text>移除截屏工具 (Snipping Tool)</Text>
					<Name>remove-snipping-tool</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>移除 Microsoft OneDrive</Text>
					<Name>remove-onedrive</Name>
				</CheckboxOption>
                <CheckboxOption IsChecked="false">
					<Text>移除 Microsoft Edge</Text>
					<Name>uninstall-edge</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage Description="选择需要关闭的选项。">
			<Options>
				<CheckboxOption>
					<Text>超级低延迟（不建议有锁屏密码）</Text>
				<Name>super-low-latency</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>台式机优化（关闭所有节能）</Text>
					<Name>desktop-optimization</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>移除 WSL（Windows 子系统 for Linux）</Text>
					<Name>remove-wsl</Name>
				</CheckboxOption>
		</Options>
	</CheckboxPage>
	</FeaturePages>
	<OOBE>
		<BulletPoints>
			<BulletPoint Icon="Lock" Title="可靠稳定"
			Description="经过充分测试，我们尽力确保这是一个可靠的部署流程。"/>
			<BulletPoint Icon="Privacy" Title="隐私增强"
			Description="通过多种方式增强隐私保护，例如移除侵犯隐私的服务。"/>
			<BulletPoint Icon="Rocket" Title="性能优化"
			Description="全新的默认应用、性能优化和精炼的 UI 调整将全部到位。"/>
		</BulletPoints>
	</OOBE>
</Playbook>

