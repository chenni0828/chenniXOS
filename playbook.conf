<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>chenniXOS</Name>
    <Username>chenni0828</Username>
    <ShortDescription>chenniXOS Playbook for Windows 11</ShortDescription>
    <Title>chenniXOS v0.2.0 Beta</Title>
    <Description><![CDATA[⚠️ 注意
版本号建议 24H2及以后发布的版本，其他版本可能达不到预期效果。
建议重装系统后使用。
]]></Description>
    <Details>面向国内用户的开放、轻量级 Windows 修改，旨在优化性能、隐私与使用体验。</Details>
    <Version>0.2.0</Version>
    <UniqueId>ab04e418-0fb4-498c-a18c-43c6fc34cbf5</UniqueId>
    <Requirements>
		<Requirement>DefenderToggled</Requirement>
		<Requirement>NoAntivirus</Requirement>
		<Requirement>NoPendingUpdates</Requirement>
		<Requirement>UCPDDisabled</Requirement>
		<Requirement>PluggedIn</Requirement>
	</Requirements>
    <Overhaul>true</Overhaul>
	<UseKernelDriver>false</UseKernelDriver>
	<EstimatedMinutes>8</EstimatedMinutes>
    <FeaturePages>
		<RadioPage DefaultOption="disable-defender" Description="禁用 Defender 可提升性能。">
			<Options>
                <RadioOption>
					<Text>保留 Defender（不做任何操作）</Text>
					<Name>enable-defender</Name>
				</RadioOption>
				<RadioOption>
					<Text>禁用 Defender</Text>
					<Name>disable-defender</Name>
				</RadioOption>
			</Options>
		</RadioPage>
        <RadioPage DefaultOption="mitigations-default" Description="选择是否额外禁用系统缓解措施。">
            <Options>
                <RadioOption>
                    <Text>不额外禁用缓解措施</Text>
                    <Name>mitigations-default</Name>
                </RadioOption>
                <RadioOption>
                    <Text>禁用所有缓解措施</Text>
                    <Name>mitigations-disable</Name>
                </RadioOption>
            </Options>
        </RadioPage>
        <CheckboxPage IsRequired="true" Description="请选择需要移除的应用和组件。">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>移除 Microsoft Edge</Text>
                    <Name>remove-edge</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>移除 OneDrive</Text>
                    <Name>remove-onedrive</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>禁用 Recall 回顾并移除 Copilot</Text>
                    <Name>remove-winsxs-ai</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>移除 Microsoft Teams</Text>
                    <Name>remove-teams</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        <CheckboxPage IsRequired="true" Description="请选择需要移除的 UWP Appx 应用。">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>移除微软照片</Text>
                    <Name>remove-appx-photos</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>移除 Dev Home</Text>
                    <Name>remove-appx-devhome</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>移除 Xbox 应用</Text>
                    <Name>remove-appx-xbox</Name>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>移除手机连接</Text>
                    <Name>remove-appx-yourphone</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
        	<CheckboxPage Description="选择需要关闭的选项。">
			<Options>
                <CheckboxOption IsChecked="false">
                    <Text>关闭打印功能（包括打印为 PDF/XPS）</Text>
                    <Name>disable-printing</Name>
                </CheckboxOption>
                <CheckboxOption>
					<Text>锁屏优化</Text>
					<Name>lock-screen-optimization</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>超级低延迟</Text>
				<Name>super-low-latency</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>台式机优化（关闭所有节能）</Text>
					<Name>desktop-optimization</Name>
				</CheckboxOption>
		</Options>
	</CheckboxPage>
        <CheckboxPage Description="选择需要复制的主题资源。">
            <Options>
                <CheckboxOption IsChecked="true">
                    <Text>设置为chenniXOS主题</Text>
                    <Name>copy-theme</Name>
                </CheckboxOption>
            </Options>
        </CheckboxPage>
    </FeaturePages>
</Playbook>
