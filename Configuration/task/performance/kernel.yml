  - !writeStatus: {status: '正在优化显卡驱动'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers',                                   value: 'TdrDelay',                    type: REG_DWORD, data: '12'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers',                                   value: 'WarpSupportsResourceResidency',type: REG_DWORD, data: '1'}

  # 关闭 BitLocker 自动设备加密
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\BitLocker', value: 'PreventDeviceEncryption', data: '1', type: REG_DWORD}
  # 关闭 UAC
  - !writeStatus: {status: '关闭 UAC'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'EnableLUA',                      type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'PromptOnSecureDesktop',           type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'ConsentPromptBehaviorAdmin',       type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'ValidateAdminCodeSignatures',      type: REG_DWORD, data: '0'}

  - !writeStatus: {status: '正在配置索引', option: 'super-low-latency'}
  - !cmd:
    command: '"Disable Search Indexing.cmd" /silent'
    exeDir: true
    wait: true
    runas: currentUserElevated
    option: 'super-low-latency'

  - !writeStatus: {status: '正在关闭 SysMain', option: 'super-low-latency'}
  - !cmd:
    command: '"Disable SysMain.cmd" /silent'
    exeDir: true
    wait: true
    runas: currentUserElevated
    option: 'super-low-latency'
    
  # UCPD关闭
  - !service: {name: 'UCPD', operation: change, startup: 4}
  - !powerShell: {command: "Disable-ScheduledTask -TaskPath '\\Microsoft\\Windows\\AppxDeploymentClient' -TaskName 'UCPD velocity' -ErrorAction SilentlyContinue", errorAction: Ignore}

  # 代码完整性移除检查
  - !registryValue:
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\CI\Policy'
    value: 'VerifiedAndReputablePolicyState'
    data: '0'
    type: REG_DWORD
  - !registryValue:
    path: 'HKLM\SYSTEM\CurrentControlSet\Control\CI\Config'
    value: 'VulnerableDriverBlocklistEnable'
    data: '0'
    type: REG_DWORD

  - !writeStatus: {status: '正在禁用 DMA 重映射'}
  - !powerShell:
      wait: true
      weight: 3
      command: >-
        $policyPath = 'HKLM:\SOFTWARE\Microsoft\PolicyManager\default\DmaGuard\DeviceEnumerationPolicy';
        try { if (-not (Test-Path $policyPath)) { New-Item -Path $policyPath -Force | Out-Null }; Set-ItemProperty -Path $policyPath -Name 'value' -Value 2 -Type DWord -Force -ErrorAction SilentlyContinue } catch {};
        try {
          Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Services' -ErrorAction SilentlyContinue | ForEach-Object {
            $paramsPath = $_.PSPath + '\Parameters';
            if (Test-Path $paramsPath) {
              try {
                $val = (Get-ItemProperty -Path $paramsPath -Name 'DmaRemappingCompatible' -ErrorAction SilentlyContinue).DmaRemappingCompatible;
                if ($null -ne $val) { Set-ItemProperty -Path $paramsPath -Name 'DmaRemappingCompatible' -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue }
              } catch {}
            }
          }
        } catch {}

  - !writeStatus: {status: '正在优化 BCDEdit'}
  - !run: {exe: 'bcdedit.exe', args: '/deletevalue useplatformclock', wait: true, ignoreErrors: true, showOutput: false, showError: false,option: 'super-low-latency'}
  - !run: {exe: 'bcdedit.exe', args: '/deletevalue useplatformtick',  wait: true, ignoreErrors: true, showOutput: false, showError: false,option: 'super-low-latency'}
  - !run: {exe: 'bcdedit.exe', args: '/set bootmenupolicy legacy',    wait: true, showOutput: false, showError: false,option: 'super-low-latency'}
  - !run: {exe: 'bcdedit.exe', args: '/timeout 10',                   wait: true, showOutput: false, showError: false}

  # 关闭烦人的安全通知
  - !registryValue: {path: 'HKLM\Software\Microsoft\Windows\CurrentVersion\Notifications\Settings\Windows.SystemToast.SecurityAndMaintenance', value: 'Enabled', data: '0', type: REG_DWORD}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Notifications\Settings\Windows.SystemToast.SecurityAndMaintenance', value: 'Enabled', data: '0', type: REG_DWORD}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows Defender Security Center\Notifications', value: 'DisableNotifications', data: '1', type: REG_DWORD}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender Security Center\Notifications', value: 'DisableNotifications', data: '1', type: REG_DWORD}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings\Zones\3', value: '1806', data: '0', type: REG_DWORD}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Internet Explorer\Security', value: 'DisableSecuritySettingsCheck', data: '1', type: REG_DWORD}
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Associations', value: 'LowRiskFileTypes', data: '.exe;.reg.;.bat.;.vbs;.cmd;.ps1;.zip;.rar;.msi;.msu;.lnk;.7z;.tar.gz;.doc;.docx;.pdf;', type: REG_SZ}


