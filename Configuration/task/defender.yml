---
title: defender
description: 按上游完整范围卸载 Defender、Windows 安全中心与相关安全组件
actions:
  # AME 的 timeout 单位为毫秒；非零退出码、启动异常和超时均中止部署。
  - !writeStatus: {status: 'Defender：正在准备卸载资源', option: 'disable-defender'}
  - !powerShell:
      command: '.\DefenderRemover\Invoke-DefenderRemoval.ps1 -Stage Prepare'
      exeDir: true
      wait: true
      runas: trustedInstaller
      timeout: 120000
      handleExitCodes: {'!0': halt}
      errorAction: Halt
      option: 'disable-defender'

  # 可延期的保护或占用由 Stop/Wait 记录为 pending 并返回 0；致命错误返回非零。
  - !writeStatus: {status: 'Defender：正在停止防护进程与服务', option: 'disable-defender'}
  - !powerShell:
      command: '.\DefenderRemover\Invoke-DefenderRemoval.ps1 -Stage Stop'
      exeDir: true
      wait: true
      runas: system
      timeout: 180000
      handleExitCodes: {'!0': halt}
      errorAction: Halt
      option: 'disable-defender'

  - !writeStatus: {status: 'Defender：正在等待防护进程退出', option: 'disable-defender'}
  - !powerShell:
      command: '.\DefenderRemover\Invoke-DefenderRemoval.ps1 -Stage Wait'
      exeDir: true
      wait: true
      runas: trustedInstaller
      timeout: 45000
      handleExitCodes: {'!0': halt}
      errorAction: Halt
      option: 'disable-defender'

  - !writeStatus: {status: 'Defender：正在移除 Windows 安全中心应用', option: 'disable-defender'}
  - !powerShell:
      command: '.\DefenderRemover\Invoke-DefenderRemoval.ps1 -Stage RemoveApp'
      exeDir: true
      wait: true
      runas: trustedInstaller
      timeout: 600000
      handleExitCodes: {'!0': halt}
      errorAction: Halt
      option: 'disable-defender'

  - !writeStatus: {status: 'Defender：正在应用移除策略并清理服务注册', option: 'disable-defender'}
  - !powerShell:
      command: '.\DefenderRemover\Invoke-DefenderRemoval.ps1 -Stage Registry'
      exeDir: true
      wait: true
      runas: trustedInstaller
      timeout: 300000
      handleExitCodes: {'!0': halt}
      errorAction: Halt
      option: 'disable-defender'

  - !writeStatus: {status: 'Defender：正在清理各用户注册信息与启动项', option: 'disable-defender'}
  - !powerShell:
      command: '.\DefenderRemover\Invoke-DefenderRemoval.ps1 -Stage UserRegistry'
      exeDir: true
      wait: true
      runas: trustedInstaller
      timeout: 180000
      handleExitCodes: {'!0': halt}
      errorAction: Halt
      option: 'disable-defender'

  - !writeStatus: {status: 'Defender：正在清理扫描与维护计划任务', option: 'disable-defender'}
  - !powerShell:
      command: '.\DefenderRemover\Invoke-DefenderRemoval.ps1 -Stage Tasks'
      exeDir: true
      wait: true
      runas: system
      timeout: 180000
      handleExitCodes: {'!0': halt}
      errorAction: Halt
      option: 'disable-defender'

  - !writeStatus: {status: 'Defender：正在删除组件文件与目录', option: 'disable-defender'}
  - !powerShell:
      command: '.\DefenderRemover\Invoke-DefenderRemoval.ps1 -Stage Files'
      exeDir: true
      wait: true
      runas: trustedInstaller
      timeout: 900000
      handleExitCodes: {'!0': halt}
      errorAction: Halt
      option: 'disable-defender'

  # Finalize 根据实际结果报告成功或待重启，并安排 Startup 补清。
  - !writeStatus: {status: 'Defender：正在汇总卸载结果并安排重启补清', option: 'disable-defender'}
  - !powerShell:
      command: '.\DefenderRemover\Invoke-DefenderRemoval.ps1 -Stage Finalize'
      exeDir: true
      wait: true
      runas: trustedInstaller
      timeout: 120000
      handleExitCodes: {'!0': halt}
      errorAction: Halt
      option: 'disable-defender'

  # 无论Defender选项如何，以下设置均会应用
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Edge', value: 'SmartScreenEnabled', type: REG_SZ, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\AppHost', value: 'EnableWebContentEvaluation', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\Software\Policies\Microsoft\Windows Defender\SmartScreen', value: 'ConfigureAppInstallControlEnabled', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\Software\Policies\Microsoft\Windows Defender\SmartScreen', value: 'ConfigureAppInstallControl', type: REG_SZ, data: 'Anywhere'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows Defender Security Center\Systray', value: 'HideSystray', type: REG_DWORD, data: '1'}

  - !writeStatus: {status: '正在禁用所有缓解措施', option: 'mitigations-disable'}
  - !cmd:
      command: '"Disable All Mitigations.cmd" /silent'
      option: 'mitigations-disable'
      exeDir: true
      wait: true
      runas: currentUserElevated
      handleExitCodes: {'!0': halt}
      errorAction: Halt

  - !writeStatus: {status: '正在禁用容错堆', option: 'super-low-latency'}
  - !run: {exe: 'rundll32.exe', args: 'fthsvc.dll,FthSysprepSpecialize', cpuArch: 'X64', option: 'super-low-latency'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\FTH', value: 'Enabled', data: '0', type: REG_DWORD, cpuArch: 'X64', option: 'super-low-latency'}
